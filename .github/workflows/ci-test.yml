name: Teste de Integração e Monitoramento
on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  integration-and-monitoring-test:
    name: Teste de Infraestrutura Completa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Subir a infraestrutura
        run: docker compose up -d --build
      - name: Aguardar inicialização
        run: echo "Aguardando 30 segundos..." && sleep 30

      # --- ETAPA DE TESTE REFEITA ---
      - name: 1. Verificar se o Frontend está respondendo
        run: >
          docker compose exec -T backend
          sh -c "apk add --no-cache curl && curl -s --head http://frontend:80 | grep '200 OK'"
      
      - name: 2. Verificar se o Backend está saudável
        run: >
          docker compose exec -T backend
          sh -c "apk add --no-cache curl && curl -s http://localhost:5174/health | grep '\"database\":\"connected\"'"