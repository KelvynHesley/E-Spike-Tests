server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Redireciona qualquer chamada para /api/... para o serviço do backend
    location /api {
        rewrite /api/(.*) /$1 break;
        proxy_pass http://backend:5174; # Aponta para o serviço 'backend' na porta 5174
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
